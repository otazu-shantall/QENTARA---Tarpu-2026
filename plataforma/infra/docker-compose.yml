# Backend de TARPU contra Supabase local (DT-23). Escrito con asistencia de IA (Claude Code).
# Lo levanta `npm start` desde plataforma/ (después de Supabase, que crea la red supabase_network_tarpu).
# A mano, desde plataforma/: docker compose -f infra/docker-compose.yml --env-file infra/.env up --build
# La API queda en http://127.0.0.1:8010/ (la pantalla de prueba en /prueba/).
x-backend: &backend
  build: ../backend
  image: tarpu-backend:local
  env_file: .env
  environment:
    TARPU_ALMACEN: supabase
    TARPU_DB_URL: postgresql://postgres:postgres@supabase_db_tarpu:5432/postgres
    TARPU_SUPABASE_URL: http://supabase_kong_tarpu:8000
  volumes:
    - ../backend/almacen:/app/almacen
  networks: [supabase]
  restart: unless-stopped

services:
  api:
    <<: *backend
    command: ["api"]
    ports: ["8010:8080"]
  trabajador:
    <<: *backend
    command: ["trabajador"]
  actualizador:
    <<: *backend
    command: ["actualizador"]
    profiles: ["actualizador"]   # se enciende con --profile actualizador (pide a NASA y ORNL de verdad)

networks:
  supabase:
    name: supabase_network_tarpu
    external: true
